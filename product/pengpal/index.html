<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#E84632">
<title>PengPal · 朋友派</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="stage">
    <aside class="about">
      <div class="about-brand">
        <span class="pmark pmark-lg" aria-hidden="true">P</span>
        <div>
          <strong>PengPal</strong> <span class="zh">朋友派</span>
          <p>Travel China like you have a friend there.</p>
        </div>
      </div>
      <p class="about-note">Clickable prototype. One trip, eight screens. Hosts, reviews and prices are
        sample data. Nothing is booked or charged.</p>
      <button class="link-btn" id="restart">Restart demo</button>
    </aside>

    <div class="phone" id="phone">
      <header class="topbar" id="topbar"></header>
      <main class="screen" id="screen" tabindex="-1"></main>
      <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
      <div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></div>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </div>
  </div>

  <script src="hosts-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
